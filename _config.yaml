# site properties and page defaults
title: Information Laboratory (InfoLab) @ SKKU
subtitle: Information Research Laboratory · SKKU
url: https://infolab-skku.github.io
description: InfoLab at Sungkyunkwan University conducts cutting-edge research in AI security, adversarial machine learning, biomedical AI, and trustworthy explainable AI systems.
logo-text: false
proofer: false

# site social media and other links
links:
  orcid: 0000-0001-9232-4843
  google-scholar: pLC4l6YAAAAJ
  github: InfoLab-SKKU
  researchgate: SKKU-InfoLab-Information-laboratory-Tamer-Abuhmed

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - tools
  - node_modules
  - package.json
  - package-lock.json
