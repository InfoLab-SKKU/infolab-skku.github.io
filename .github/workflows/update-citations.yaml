name: update-citations
run-name: update citations

on:
  # run when called from another workflow
  workflow_call:
    inputs:
      open-pr:
        type: boolean
    outputs:
      changed:
        value: ${{ jobs.update-citations.outputs.changed }}

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_COLOR: true
  GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # for debugging
      - uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          # head_ref is set for PRs; ref_name (e.g. "main") is set for push events.
          # Without an explicit ref, checkout uses the triggering SHA in detached
          # HEAD mode, which prevents git-auto-commit-action from pushing.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Pull latest remote changes
        # Rebase onto the current remote tip so our commit is always fast-forward.
        # This guards against another commit landing between our checkout and push.
        run: git pull --rebase origin ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Cache cite data
        uses: actions/cache@v4
        with:
          path: ./_cite/.cache
          key: cite-cache-${{ runner.os }}-${{ hashFiles('_data/*.yaml') }}
          restore-keys: |
            cite-cache-${{ runner.os }}-

      - name: Install Python packages
        run: |
          python -m pip install --upgrade --requirement ./_cite/requirements.txt

      # for debugging
      - if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Back up generated citation files
        run: |
          mkdir -p "$RUNNER_TEMP/citation-backup"
          for path in _data/citations.yaml _data/sources.yaml; do
            if [ -e "$path" ]; then
              cp -p "$path" "$RUNNER_TEMP/citation-backup/$(basename "$path")"
            fi
          done
          if [ -d images/thumbnails ]; then
            cp -a images/thumbnails "$RUNNER_TEMP/citation-backup/thumbnails"
          fi

      - name: Build updated citations with retries
        id: citation-build
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Citation update attempt ${attempt}/3"
            python _cite/cite.py
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Citation metadata service failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::warning::Citation metadata update failed after retries; preserving the last known-good citations"
          exit 1
        timeout-minutes: 25

      - name: Restore last known-good citations
        if: steps.citation-build.outcome == 'failure'
        run: |
          for path in _data/citations.yaml _data/sources.yaml; do
            backup="$RUNNER_TEMP/citation-backup/$(basename "$path")"
            if [ -f "$backup" ]; then
              cp -p "$backup" "$path"
            fi
          done
          if [ -d "$RUNNER_TEMP/citation-backup/thumbnails" ]; then
            rm -rf images/thumbnails
            cp -a "$RUNNER_TEMP/citation-backup/thumbnails" images/thumbnails
          fi

      - name: Check if citations changed
        id: changed
        uses: tj-actions/verify-changed-files@v18
        with:
          files: |
            _data/citations.yaml
            _data/sources.yaml
            images/thumbnails/**

      - name: Commit updated citations to branch
        if: |
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr != true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update citations [skip ci]"
          push_options: "--force-with-lease"

      - name: Open pull request with updated citations
        if: |
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr == true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: citation-update
          title: Periodic citation update

    outputs:
      changed: ${{ steps.changed.outputs.files_changed }}
