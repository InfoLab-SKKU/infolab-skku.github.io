<!-- IBM Plex Sans & Roboto Mono from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

{% comment %}
  Font Awesome loads asynchronously. Pages that don't render any icons
  (e.g. 404) can opt out by setting `icons: false` in front matter.
{% endcomment %}
{% if page.icons != false %}
  {% assign fontawesome = "https://use.fontawesome.com/releases/v6.5.0/css/all.css" %}
  <link rel="preconnect" href="https://use.fontawesome.com" crossorigin>
  <link rel="preload" as="style" href="{{ fontawesome }}" onload="this.onload=null;this.rel='stylesheet';">
  <noscript><link rel="stylesheet" href="{{ fontawesome }}"></noscript>
{% endif %}
