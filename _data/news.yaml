- title: Exposing Deep Vulnerabilities in Interpretable NLP Systems
  date: 2025-07-22
  description: Natural Language Processing (NLP) models, even those built for transparency and interpretability, remain highly vulnerable to adversarial manipulation. Our newly submitted paper, AdvChar, presents a stealthy black-box attack that preserves semantic meaning and interpretability while misleading classifiers. By applying minimal character-level modifications (only two characters on average), AdvChar can dramatically deteriorate model accuracy across seven NLP models and three interpretation paradigms revealing that interpretability tools can be exploited to disguise malicious inputs. Read more on arXiv.
  url: https://arxiv.org/abs/2507.16164

- title: AdViT; Breaking Vision Transformers and Their Interpreters
  date: 2025-07-21
  description: Vision Transformers (ViTs), often paired with interpretation models, are widely viewed as robust and reliable for security-critical domains such as healthcare, autonomous driving, drones, and robotics. However, our latest paper challenges this assumption by introducing AdViT, a novel attack that successfully deceives both ViT classifiers and their interpreters. AdViT achieves a 100% attack success rate across diverse models, with up to 98% misclassification confidence in white-box and 76% in black-box settings while still producing convincing interpretations. These results reveal that even state-of-the-art transformer systems remain highly vulnerable to stealthy adversarial threats. Read more on arXiv.
  url: https://arxiv.org/abs/2507.14248

