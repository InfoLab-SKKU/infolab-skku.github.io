# Short venue tags shown on news / activity-stream items.
# `match` is checked (case-insensitive) against each news item's
# title + description; the FIRST match's `label` is shown as the tag.
# Order matters — put more specific matches first.
# A news item may also set an explicit `venue:` field to override this lookup.

- match: "information fusion"
  label: "Information Fusion"
- match: "applied soft computing"
  label: "Applied Soft Computing"
- match: "sigkdd"
  label: "ACM KDD"
- match: "knowledge discovery and data mining"
  label: "ACM KDD"
